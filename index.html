<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Sports Video Analytics</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <h1>🏟️ Sports Video Analytics</h1>
      <p class="subtitle">Client-side camera analytics — elbow angle, reaction time, delayed review</p>
    </div>
    <div class="header-controls">
      <label for="cameraSelect">Camera</label>
      <select id="cameraSelect" title="Select USB camera"></select>
      <button id="refreshCameras" type="button" title="Re-scan cameras">↻</button>
      <button id="menuToggle" class="menu-btn" type="button" aria-haspopup="true"
        aria-expanded="false" aria-controls="menuPopup" title="Open tools menu">
        ☰ <span class="menu-btn-label">Tools</span>
      </button>
    </div>
  </header>

  <main class="app-main">
    <section id="workspace" class="workspace" aria-live="polite">
      <div class="placeholder">
        <p>Open the Tools menu (☰) to begin.</p>
        <p class="hint">Camera access requires a secure context (https or localhost).</p>
      </div>
    </section>
  </main>

  <!-- Pop-up tools menu: opened from the header ☰ button -->
  <div id="menuBackdrop" class="menu-backdrop" hidden></div>
  <div id="menuPopup" class="menu-popup" role="menu" aria-label="Analytics tools" hidden>
    <div class="menu-popup-head">
      <span class="menu-popup-title">Tools</span>
      <button id="menuClose" class="menu-close" type="button" title="Close menu">✕</button>
    </div>
    <nav class="tool-nav" aria-label="Analytics tools">
      <button class="tool-btn" data-tool="elbow-angle">🦾 Elbow Angle</button>
      <button class="tool-btn" data-tool="reaction-time">⚡ Reaction Time</button>
      <button class="tool-btn" data-tool="video-delay">⏱️ Video Delay</button>
      <button class="tool-btn" data-tool="ghost">👻 Ghost Compare</button>
      <button class="tool-btn" data-tool="frame-sequence">🎞️ Frame Sequence</button>
    </nav>
    <button id="stopTool" class="stop-btn" type="button" disabled>■ Stop</button>
  </div>

  <footer class="app-footer">
    <span id="status" class="status">Idle</span>
  </footer>

  <!-- TensorFlow.js + pose-detection for the elbow-angle module -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.0/dist/pose-detection.min.js"></script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
